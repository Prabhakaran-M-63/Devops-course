name: Docker CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  docker:
    runs-on: ubuntu-latest  # Changed from wsl-linux to standard GitHub runner for testing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -f Dockerfile.distroless -t distroless .

      - name: Tag and Push Docker Image
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker tag distroless ${{ vars.DOCKERHUB_USERNAME }}/nodeapp6:$SHA
          docker push ${{ vars.DOCKERHUB_USERNAME }}/nodeapp6:$SHA
