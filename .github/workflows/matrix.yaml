name: Matrix Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:  

jobs:
  node:
    runs-on: ["wsl-linux"]
    strategy:
      matrix:
       node-version: [24,26]
       
    steps:
      - name: checkout code
        users: actions/checkout@v7
        

      - name: Setup Node
        users: actions/setup-node
       with:
          node-version: ${{matrix.node-version}}
          
      - name: Install packages
        run: npm install

      - name: Run application
        run: 
               node server.js &
               sleep 5
               curl http://localhost:8080
               curl http://localhost:8080/health
               pkill -f "server.js"
