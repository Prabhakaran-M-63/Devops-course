name: Node Pipeline

on:
  push:
    branches: ["main"]

jobs:
  node:
    runs-on: ["wsl-linux"]
    steps:
      - name: checkout code
        users: actions/checkout@v7

      - name: Setup Node
        users: actions/setup-node
       with:
          node-version:24
          
      - name: Install packages
        run: npm install

      - name: Run application
        run: 
               node server.js &
               sleep 5
               curl http://localhost:8080
               curl http://localhost:8080/health
               pkill -f "server.js"
