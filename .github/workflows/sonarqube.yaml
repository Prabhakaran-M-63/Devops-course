name: Sonarqube pipeline

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  sonarqube:
    runs-on: ["wsl-linux"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This runs the scanner inside a container where unzip is already installed!
      - name: Sonarqube analysis via Container
        run: |
          docker run --rm \
            --net=host \
            -v "$(pwd):/usr/src" \
            docker.io/sonarsource/sonar-scanner-cli:latest \
            -Dsonar.projectKey=NodeApp \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token=sqp_4bc5ddaf0cba009f3bd57cb22c32e2a813b3b57d
